<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1,
        maximum-scale=1,
        user-scalable=no,
        viewport-fit=cover"
    >

    <title>Particle Universe Observation Engine</title>

    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/entry.css">
    <link rel="stylesheet" href="./css/universe.css">
    <link rel="stylesheet" href="./css/controls.css">
</head>

<body>

    <!-- Renderer -->
    <canvas id="universeCanvas"></canvas>

    <!--
        ENTRY ISOLATION
        This element belongs ONLY to click-entry.js
    -->
    <div id="entryLayer">
        <button id="enterButton" type="button">
            Click to Enter
        </button>
    </div>

    <!-- Tiny custom image control -->
    <label id="imageAdder" for="imageInput" aria-label="Add image">
        +
    </label>

    <input
        id="imageInput"
        type="file"
        accept="image/*"
        multiple
        hidden
    >

    <div id="fallbackMessage"></div>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
